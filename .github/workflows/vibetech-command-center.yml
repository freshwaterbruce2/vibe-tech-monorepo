# VibeTech Command Center CI
# Electron 33 desktop app — packaged with electron-builder, not containerized.
# No Dockerfile or docker-compose is used; the app is built into a Windows NSIS
# installer / unpacked directory via electron-builder.
#
# Path-filtered: runs only when command-center source or this workflow change.

name: VibeTech Command Center CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/vibetech-command-center/**'
      - '.github/workflows/vibetech-command-center.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/vibetech-command-center/**'
      - '.github/workflows/vibetech-command-center.yml'

permissions:
  contents: read

concurrency:
  group: vibetech-command-center-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  # ============================================
  # QUALITY GATES (lint, typecheck, build, test)
  # ============================================
  quality:
    name: Quality Gates
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Lint
        run: pnpm nx lint @vibetech/command-center

      - name: Typecheck
        run: pnpm nx typecheck @vibetech/command-center

      - name: Build
        run: pnpm nx build @vibetech/command-center

      - name: Unit tests (Vitest)
        continue-on-error: true
        run: pnpm nx test @vibetech/command-center

  # ============================================
  # PACKAGE (unpacked app artifact)
  # ============================================
  package:
    name: Package (unpacked)
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Build unpacked app
        run: pnpm nx run @vibetech/command-center:package:dir

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibetech-command-center-unpacked
          path: apps/vibetech-command-center/release/
          retention-days: 7
