# Vibe-Tutor Android Release Pipeline
# Compiles, signs, and packages the vibe-tutor Android App Bundle (.aab) securely
# triggering on tagged release branches or manual workflow dispatches.

name: vibe-tutor Android Release

on:
  push:
    tags:
      - 'vibe-tutor-v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release track on Google Play (internal, alpha, beta, production)'
        required: true
        default: 'internal'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  JAVA_VERSION: '21'

jobs:
  release-build:
    name: Build & Sign Android App Bundle (.aab)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa8985bcf96b3034485 # v4.0.0
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Assets (vibe-tutor)
        env:
          NODE_ENV: production
          CROSS_ENV: production
        run: pnpm --filter vibe-tutor build

      - name: Sync Capacitor Android Project
        run: pnpm --filter vibe-tutor exec cap sync android

      - name: Restore Secure Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.VIBE_TUTOR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::VIBE_TUTOR_RELEASE_KEYSTORE_BASE64 is missing. Build cannot be signed."
            exit 1
          fi
          # Decode the secure base64 signing key directly to the native app path
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/vibe-tutor/android/app/vibe-tutor-release.keystore

      - name: Compile and Sign Android App Bundle (.aab)
        working-directory: apps/vibe-tutor/android
        env:
          VIBE_TUTOR_KEYSTORE_PATH: vibe-tutor-release.keystore
          VIBE_TUTOR_KEYSTORE_PASSWORD: ${{ secrets.VIBE_TUTOR_KEYSTORE_PASSWORD }}
          VIBE_TUTOR_KEY_ALIAS: ${{ secrets.VIBE_TUTOR_KEY_ALIAS }}
          VIBE_TUTOR_KEY_PASSWORD: ${{ secrets.VIBE_TUTOR_KEY_PASSWORD }}
        run: ./gradlew clean bundleRelease

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibe-tutor-release-bundle
          path: apps/vibe-tutor/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Optional Deployment Step (Uncomment and configure secrets to upload directly to Google Play)
      # - name: Upload to Google Play Store Console
      #   uses: r0adrunner/upload-google-play@v1
      #   with:
      #     serviceAccountJsonRaw: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.vibetech.tutor
