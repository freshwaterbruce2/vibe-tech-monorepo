# Invoice Automation SaaS CI
# Path-filtered validation workflow for invoice-automation-saas.
# Runs lint, typecheck, test, and build gates on push/PR to main.

name: invoice-automation-saas CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/invoice-automation-saas/**'
      - '.github/workflows/invoice-automation-saas.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/invoice-automation-saas/**'
      - '.github/workflows/invoice-automation-saas.yml'

permissions:
  contents: read

concurrency:
  group: invoice-automation-saas-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  validate:
    name: Lint + Typecheck + Test + Build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
        timeout-minutes: 5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Lint
        run: pnpm nx run invoice-automation-saas:lint
        timeout-minutes: 10

      - name: Typecheck
        run: pnpm nx run invoice-automation-saas:typecheck
        timeout-minutes: 10

      - name: Test
        run: pnpm nx run invoice-automation-saas:test
        timeout-minutes: 10

      - name: Build frontend
        run: pnpm nx run invoice-automation-saas:build
        timeout-minutes: 10

      - name: Build API
        run: pnpm nx run invoice-automation-saas:api:build
        timeout-minutes: 10
