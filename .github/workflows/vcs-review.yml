# VCS PR Review Bot — spec 15 (apps/vibe-code-studio/FEATURE_SPECS/competitive-gaps/15-PR-REVIEW-BOT.md)
# Posts an AI review (summary comment + inline diff comments) on every code PR.
# Missing OPENROUTER_API_KEY/DEEPSEEK_API_KEY secrets degrade to heuristics-only
# review — never a red check. Budget-capped per PR via .vcs/review.json.
name: VCS PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.py'
      - '**/*.rs'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vcs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  # Required: the committed .npmrc pins store-dir to a developer-local V:\ volume
  npm_config_store_dir: '${{ github.workspace }}-pnpm-store'

jobs:
  review:
    # Actor guard doubles as the cheap AC#12 self-trigger exclusion
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run review bot
        run: pnpm exec tsx apps/vibe-code-studio/scripts/review-ci.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
