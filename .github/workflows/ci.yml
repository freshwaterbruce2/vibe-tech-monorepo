# GitHub Actions CI for pnpm monorepo
# Nx-affected quality gates + monorepo sync audit
# Security: Actions pinned to commit SHAs, least-privilege permissions

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

# Least-privilege: default to read-only for all jobs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  NODE_OPTIONS: '--max-old-space-size=4096'
  NX_DAEMON: 'false'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_CACHE_FAIL_ON_ERROR: 'false'
  NX_REJECT_UNKNOWN_LOCAL_CACHE: '0'
  # The committed .npmrc pins store-dir to a developer-local volume (V:\) so
  # pnpm hard-links stay on the same volume as the code. CI runners have no V:\,
  # so override the store to a sibling of the workspace (same D:\a volume, so
  # same-volume hard-linking stays valid) that is OUTSIDE the checkout, so nx
  # does not scan the store and infer phantom projects from its tmp extractions.
  # NB: runner.temp is unavailable in workflow-level env; github.workspace is.
  npm_config_store_dir: '${{ github.workspace }}-pnpm-store'
  DATABASE_PATH: '${{ github.workspace }}/d-drive/databases/memory.db'
  LOG_PATH: '${{ github.workspace }}/d-drive/logs'
  LEARNING_SYSTEM_PATH: '${{ github.workspace }}/d-drive/learning-system'

jobs:
  # ============================================
  # QUALITY GATES (Run on all branches)
  # ============================================
  quality:
    name: Quality Gates
    runs-on: windows-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
      deployment: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Provision Mocked Drive Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/databases"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/logs"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/learning-system"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Sync audit
        run: pnpm run ci:sync

      - name: Prepare directly changed projects
        shell: pwsh
        run: |
          # Shared with the local parity gate (scripts/ci-local.mjs / the
          # pre-push hook) so "green locally" predicts "green in CI" instead
          # of the two drifting apart.
          $projectList = node scripts/select-changed-projects.mjs --base origin/main --head HEAD

          if ([string]::IsNullOrWhiteSpace($projectList)) {
            Write-Host "No changed files mapped to Nx projects; Quality Gates will skip Nx target tasks."
            "NX_CI_PROJECTS=" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }

          Write-Host "Validating directly changed Nx projects: $projectList"
          "NX_CI_PROJECTS=$projectList" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Lint (affected)
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NX_CI_PROJECTS)) {
            Write-Host "Lint skipped; no changed Nx projects."
            exit 0
          }
          $projects = pnpm nx show projects --withTarget lint --projects "$env:NX_CI_PROJECTS" --sep=','
          if ([string]::IsNullOrWhiteSpace($projects)) {
            Write-Host "Lint skipped; changed projects do not expose lint targets."
            exit 0
          }
          pnpm nx run-many -t lint --projects="$projects" --parallel=2 --outputStyle=static

      - name: Typecheck (affected)
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NX_CI_PROJECTS)) {
            Write-Host "Typecheck skipped; no changed Nx projects."
            exit 0
          }
          $projects = pnpm nx show projects --withTarget typecheck --projects "$env:NX_CI_PROJECTS" --sep=','
          if ([string]::IsNullOrWhiteSpace($projects)) {
            Write-Host "Typecheck skipped; changed projects do not expose typecheck targets."
            exit 0
          }
          pnpm nx run-many -t typecheck --projects="$projects" --parallel=2 --outputStyle=static

      - name: Test (affected)
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NX_CI_PROJECTS)) {
            Write-Host "Test skipped; no changed Nx projects."
            exit 0
          }
          $projects = pnpm nx show projects --withTarget test --projects "$env:NX_CI_PROJECTS" --sep=','
          if ([string]::IsNullOrWhiteSpace($projects)) {
            Write-Host "Test skipped; changed projects do not expose test targets."
            exit 0
          }
          # Exclude vibe-justice: its `test` target depends on `test:backend`
          # (pytest), which needs a Python toolchain this JS runner does not
          # provide. The dedicated vibe-justice.yml workflow already runs the
          # frontend Vitest suite and the backend pytest suite, so excluding it
          # here loses no coverage. See apps/vibe-justice/project.json.
          pnpm nx run-many -t test --projects="$projects" --exclude=vibe-justice --parallel=2 --outputStyle=static

      # Nx Cloud self-healing requires Nx Cloud auth and is not supported on
      # Windows runners. Keep required PR quality gates local and deterministic.

  # ============================================
  # BUILD (main and develop only)
  # ============================================
  build:
    name: Build
    runs-on: windows-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
      deployment: false
    needs: quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Provision Mocked Drive Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/databases"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/logs"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/learning-system"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (affected)
        run: pnpm run ci:build

      - name: Run Nx Cloud self-healing (build)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm exec nx fix-ci

  # ============================================
  # CHANGESET STATUS CHECK (PRs only)
  # ============================================
  changeset-check:
    name: Changeset Check
    runs-on: windows-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure local main branch exists
        # PR checkout leaves HEAD detached on the merge commit; `origin/main`
        # is fetched but no local `main` branch is created. `@changesets/git`
        # runs `git merge-base main HEAD`, which needs a local ref.
        run: git branch -f main origin/main

      - name: Check changesets
        # pnpm changeset status exits 1 when there are no changesets in the PR
        # (a normal and allowed condition for changes that don't require a
        # release note). pwsh's `$cmd || echo "..."` does NOT reset
        # $LASTEXITCODE, so the previous form always failed the step.
        # Explicitly swallow the exit-1 "no changesets" case here; any other
        # exit code (config error, divergence failure, etc.) still propagates.
        shell: pwsh
        run: |
          pnpm changeset status --verbose
          if ($LASTEXITCODE -eq 1) {
            Write-Host "No changesets found (allowed for non-release-worthy changes)."
            exit 0
          }
          exit $LASTEXITCODE

  # ============================================
  # RELEASE AUTOMATION (main branch only)
  # ============================================
  release:
    name: Release
    runs-on: windows-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
      deployment: false
    needs: [quality, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish packages
        uses: changesets/action@d94a5c301145045a0960133674e003b265942a22 # v1.8.0
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================
  # COVERAGE (non-blocking while coverage targets are being completed)
  # ============================================
  coverage:
    name: Coverage (affected, non-blocking)
    runs-on: windows-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
      deployment: false
    needs: quality
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Provision Mocked Drive Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/databases"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/logs"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/learning-system"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage (affected)
        shell: pwsh
        run: |
          pnpm run ci:coverage
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Advisory coverage failed; keeping non-blocking PR signal green."
            exit 0
          }

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-coverage
          path: |
            coverage/**
            apps/**/coverage/**
            packages/**/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  # ============================================
  # NODE 24 COMPATIBILITY (non-blocking canary)
  # ============================================
  node24-canary:
    name: Node 24 Compatibility (non-blocking)
    runs-on: windows-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
      deployment: false
    needs: quality
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    env:
      NODE_VERSION: '24'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Provision Mocked Drive Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/databases"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/logs"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/d-drive/learning-system"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (affected)
        shell: pwsh
        run: |
          pnpm run ci:typecheck
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Node 24 advisory typecheck failed; keeping non-blocking PR signal green."
            exit 0
          }

      - name: Build (affected)
        shell: pwsh
        run: |
          pnpm run ci:build
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Node 24 advisory build failed; keeping non-blocking PR signal green."
            exit 0
          }

  # ============================================
  # E2E TESTS (main, develop, and PRs)
  # ============================================
  e2e:
    name: E2E Tests (Chromium)
    runs-on: windows-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
      deployment: false
    needs: quality
    timeout-minutes: 30
    # The legacy business-booking-platform Playwright suite is currently
    # deterministic-red and expensive on Windows. Keep it available for manual
    # triage, but do not run it on every push while the BBP-next migration lands.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E tests
        run: pnpm run ci:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: coverage/apps/business-booking-platform-next/
          retention-days: 7
