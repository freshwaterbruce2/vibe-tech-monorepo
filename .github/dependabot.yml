# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions - check for action updates weekly
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'
    open-pull-requests-limit: 5

  # Root npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 10
    ignore:
      # Don't auto-update major versions (breaking changes)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Python - LLM fine-tuning backend (had open security alerts)
  - package-ecosystem: 'pip'
    directory: '/backend/llm-finetuning'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'
      - 'python'
    open-pull-requests-limit: 5

  # Rust - Tauri desktop apps (Cargo.lock had open security alerts)
  - package-ecosystem: 'cargo'
    directory: '/apps/nova-agent/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'thursday'
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'
      - 'rust'
    open-pull-requests-limit: 5

  - package-ecosystem: 'cargo'
    directory: '/apps/vibe-justice/frontend/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'thursday'
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'
      - 'rust'
    open-pull-requests-limit: 5
