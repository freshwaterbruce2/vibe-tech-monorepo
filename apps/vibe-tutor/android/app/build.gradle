apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def packageJsonFile = rootProject.file("../package.json")
def appVersionName = "1.0.0"
if (packageJsonFile.exists()) {
    try {
        def packageJson = new JsonSlurper().parseText(packageJsonFile.text)
        def rawVersion = packageJson?.version
        if (rawVersion instanceof String && !rawVersion.trim().isEmpty()) {
            appVersionName = rawVersion.trim()
        }
    } catch (Exception ignored) {
        logger.warn("Failed to parse package.json version. Falling back to ${appVersionName}")
    }
}

def appVersionCode = rootProject.ext.androidVersionCode
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def lowered = taskName.toLowerCase()
    lowered.contains('release') || lowered.contains('bundle')
}
def integrityProjectNumber = project.findProperty('VIBE_TUTOR_INTEGRITY_CLOUD_PROJECT_NUMBER') ?: System.getenv('VIBE_TUTOR_INTEGRITY_CLOUD_PROJECT_NUMBER') ?: '0'

android {
    namespace "com.vibetech.tutor"
    buildFeatures {
        buildConfig true
    }
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vibetech.tutor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "long", "VIBE_TUTOR_INTEGRITY_CLOUD_PROJECT_NUMBER", "${integrityProjectNumber}L"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // 1. Attempt to resolve credentials from system environment variables
            def targetStoreFile = System.getenv("VIBE_TUTOR_KEYSTORE_PATH")
            def targetStorePassword = System.getenv("VIBE_TUTOR_KEYSTORE_PASSWORD")
            def targetKeyAlias = System.getenv("VIBE_TUTOR_KEY_ALIAS")
            def targetKeyPassword = System.getenv("VIBE_TUTOR_KEY_PASSWORD")

            // 2. Fall back to local gradle.properties variables if environment variables are not set
            if (!targetStoreFile && project.hasProperty('VIBE_TUTOR_RELEASE_STORE_FILE')) {
                targetStoreFile = project.property('VIBE_TUTOR_RELEASE_STORE_FILE')
                targetStorePassword = project.property('VIBE_TUTOR_RELEASE_STORE_PASSWORD')
                targetKeyAlias = project.property('VIBE_TUTOR_RELEASE_KEY_ALIAS')
                targetKeyPassword = project.property('VIBE_TUTOR_RELEASE_KEY_PASSWORD')
            }

            // 3. Enforce strict assertion if a release task is requested
            if (targetStoreFile && targetStorePassword && targetKeyAlias && targetKeyPassword) {
                // Path segregation guardrail: signing keys must never live inside the git-tracked code tree.
                def keystoreFile = new File(targetStoreFile)
                def checkoutRoot = rootProject.file("..").canonicalFile
                if (keystoreFile.canonicalFile.toPath().startsWith(checkoutRoot.toPath())) {
                    throw new GradleException("CRITICAL: Keystore must not reside inside the Vibe Tutor checkout.")
                }
                if (keystoreFile.exists()) {
                    storeFile keystoreFile
                    storePassword targetStorePassword
                    keyAlias targetKeyAlias
                    keyPassword targetKeyPassword
                } else if (releaseTaskRequested) {
                    throw new GradleException("CRITICAL: Keystore file not found at: " + targetStoreFile)
                } else {
                    println "WARNING: Keystore file not found at: " + targetStoreFile
                }
            } else if (releaseTaskRequested) {
                throw new GradleException("CRITICAL: Release signing configuration is incomplete. Ensure VIBE_TUTOR_RELEASE_* properties are set in ~/.gradle/gradle.properties or env.")
            } else {
                println "WARNING: Release signing configuration is incomplete. Release builds will fail."
            }
        }
    }

    buildTypes {
        release {
            if (releaseTaskRequested && integrityProjectNumber == '0') {
                throw new GradleException("CRITICAL: VIBE_TUTOR_INTEGRITY_CLOUD_PROJECT_NUMBER is required for release builds.")
            }
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.android.play:integrity:1.6.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
