[build]
jobs = 1

# NOTE: no MSVC linker/toolchain pins here — cargo auto-detects via vswhere on
# every machine (CI runners have VS2022 at a different path than local VS18).
# If a specific machine needs a pinned toolset, put it in the untracked
# %USERPROFILE%\.cargo\config.toml, never in the repo.

[env]
# Increase rustc thread stack size to prevent STATUS_STACK_BUFFER_OVERRUN
# on large crates like DataFusion (deep macro/type recursion in release builds)
RUST_MIN_STACK = "16777216"
# Keep MSVC telemetry helpers out of automated Rust builds. The uploader is not
# required for compilation and has produced blocking .NET error dialogs locally.
VSCMD_SKIP_SENDTELEMETRY = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
